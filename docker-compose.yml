services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gradiol}
      POSTGRES_USER: ${POSTGRES_USER:-gradiol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradiol_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
    entrypoint: ["/app/gradiol-migrate"]
    command: ["setup"]
    env_file:
      - .env
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
